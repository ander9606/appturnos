name: Mobile CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
  workflow_dispatch:
    inputs:
      group_id:
        description: 'Update group ID a promover a producción (lo imprime el job de OTA → staging)'
        required: true

jobs:
  # ── Type check (corre en PR y en push a main) ──────────────────
  ci:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Type check
        run: npm run type-check

  # ── OTA Update (solo en push a main) ──────────────────────────
  # Publica el bundle JS al canal de staging — no llega a usuarios reales
  # todavía. Solo aplica a cambios de código JS/TS, no a cambios nativos.
  ota-update:
    name: OTA Update → staging
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: OTA Update — rama staging
        run: |
          eas update \
            --branch staging \
            --message "$COMMIT_MESSAGE" \
            --non-interactive
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          # Client ID público de Google OAuth (no sensible — mismo valor que en eas.json).
          # Hardcodeado en vez de secret: no requiere configurar nada en GitHub.
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: "983031197089-h85egasr849sd2h042kprj18d9l45bn2.apps.googleusercontent.com"

      # `eas update` sube el bundle directo a EAS, sin dejar sourcemaps locales ni
      # subirlos a Sentry — la integración nativa (Gradle/Xcode, ver eas.json) solo
      # aplica a `eas build`. Por eso se exporta el mismo bundle por separado (mismas
      # variables EXPO_PUBLIC_* que arriba, si difieren el Debug ID no calza con el
      # bundle que en verdad se publicó) y se sube con el script oficial del SDK.
      - name: Exportar bundle + sourcemaps para Sentry
        # --platform android: por defecto (--platform all) expo export también
        # arma el bundle de web, y esta app no es compatible con web
        # (react-native-maps importa módulos nativos). Agregar "ios" acá cuando
        # la app se distribuya también en esa plataforma.
        run: npx expo export --source-maps --output-dir dist --platform android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: "983031197089-h85egasr849sd2h042kprj18d9l45bn2.apps.googleusercontent.com"

      - name: Subir sourcemaps a Sentry
        run: node node_modules/@sentry/react-native/scripts/expo-upload-sourcemaps.js dist
        env:
          SENTRY_ORG: zaturno
          SENTRY_PROJECT: react-native
          # El script solo evita leer el expo config (donde no está configurado, ya
          # que el plugin se llama "@sentry/react-native" y no "@sentry/react-native/expo")
          # si ORG, PROJECT y URL están las tres presentes.
          SENTRY_URL: https://sentry.io/
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # ── Promover a producción (manual) ────────────────────────────
  # Dispara desde GitHub Actions → "Run workflow", pasando el group_id que
  # imprime el paso "OTA Update — rama staging" de arriba. Republica el
  # MISMO bundle ya probado en staging — no recompila desde el código actual.
  ota-promote-production:
    name: Promover staging → producción
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Republicar grupo probado en staging → producción
        run: |
          eas update:republish \
            --group "$GROUP_ID" \
            --destination-channel production \
            --message "Promovido desde staging: $GROUP_ID" \
            --non-interactive
        env:
          GROUP_ID: ${{ github.event.inputs.group_id }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

# ──────────────────────────────────────────────────────────────────
# NOTA: Build nativo (cuando cambias dependencias o app.json)
# No corre automáticamente — lanzar manualmente:
#
#   eas build --platform android --profile production
#   eas build --platform ios     --profile production
#   eas submit --platform android
#   eas submit --platform ios
#
# O agregar un workflow separado disparado por tags:
#   on:
#     push:
#       tags: ['v*']
# ──────────────────────────────────────────────────────────────────
