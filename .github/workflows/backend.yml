name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  # ── Checks (corre en PR y en push a main) ─────────────────────
  ci:
    name: Tests & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Auditoría de seguridad
        # Solo dependencias de producción (jest/nodemon nunca llegan al build).
        # Nivel critical: la cadena exceljs→archiver tiene high/moderate sin fix
        # upstream limpio (ver package.json overrides) — no bloquea deploy hasta
        # que haya una versión de exceljs que la resuelva sin downgrade.
        run: npm audit --omit=dev --audit-level=critical

  # ── Integración con MySQL 8 real (el resto de los tests mockea la DB) ──
  mysql:
    name: Integración MySQL 8
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: app_turnos_ci
      JWT_SECRET: ci-secret
      FIRMA_ENCRYPTION_KEY: '1e307b0cccfa3f3c759291df3b8dc09d49325845672911ab77f707f8372729c2'
      RUN_DB_TESTS: '1'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Aplicar migraciones
        run: npm run migrate

      - name: Tests de integración
        run: npx jest __tests__/integration

  # ── Deploy (solo en push a main, solo si CI pasó) ─────────────
  deploy:
    name: Deploy al VPS
    needs: [ci, mysql]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Mismo grupo que web.yml — un solo deploy al VPS a la vez. cancel-in-progress:
    # false porque un deploy a medias (docker compose up cortado) es peor que esperar.
    concurrency:
      group: vps-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy vía SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          ssh root@"$HOST" << 'ENDSSH'
            set -e
            cd /app
            echo "→ Actualizando código..."
            git pull origin main
            echo "→ Asegurando cron de backup diario..."
            (crontab -l 2>/dev/null | grep -qF 'backup-db.sh') || \
              ( (crontab -l 2>/dev/null; echo '0 8 * * * /app/backend/scripts/backup-db.sh >> /var/log/mysql-backup.log 2>&1') | crontab - )
            echo "→ Reconstruyendo API..."
            docker compose --env-file backend/.env build --pull api
            echo "→ Reiniciando API..."
            docker compose --env-file backend/.env stop api
            docker compose --env-file backend/.env rm -f api
            docker compose --env-file backend/.env up -d api
            echo "→ Verificando health (migraciones + servidor)..."
            for i in $(seq 1 30); do
              if docker compose --env-file backend/.env exec -T api wget -qO- http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "→ Logs de migraciones:"
                docker compose --env-file backend/.env logs api --tail 30 2>&1 | grep -iE "migra|aplica|pendiente|error|warn" || true
                echo "✅ Deploy completado"
                exit 0
              fi
              sleep 2
            done
            echo "❌ Health check falló después de 60s — últimos logs:"
            docker compose --env-file backend/.env logs api --tail 40
            exit 1
          ENDSSH
